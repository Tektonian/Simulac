# START - project setting
[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "simulac"
version = "0.1.0"
description = "A CLI, library, and local server for interacting with the Tektonian backend."
authors = [{ name = "Jeuk Kang", email = "gangjeuk@tektonian.com" }]
keywords = [
    "robotics",
    "robot-simulation",
    "simulation",
    "physics-engine",
    "mujoco",
    "newton",
    "genesis",
    "mjcf",
    "urdf",
    "usd",
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 3 - Alpha",

    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",

    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "duckdb>=1.5.3",
    "structlog>=25.5.0",
    "mujoco>=3.9.0",
    "websockets>=16.0",
    "typer>=0.26.7",
    "zstd>=1.5.7.3",
    "msgpack>=1.1.2",
    "requests>=2.34.2",
    "trimesh>=4.12.2",
]

[project.scripts]
simulac = "simulac.cli:main"

[project.urls]
Homepage = "https://tektonian.com"
Repository = "https://github.com/Tektonian/Simulac"

[project.optional-dependencies]
genesis = ["genesis-world>=1.1.0", "torch>=2.12.0"]

newton = ["newton>=1.2.1", "warp-lang>=1.14.0", "mujoco-warp>=3.9.0.1"]

doc = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pylint==4.0.5",
    "ruff>=0.15.16",
    "pybind11-stubgen>=2.5.5",
    "typing_extensions>=4.15.0,<5",
    "eval_type_backport>=0.4.0; python_version < '3.12'",
    "packaging>=26.2",
    "pytest>=9.0.3",
    "nox>=2026.4.10",
    "pytest-cov>=7.1.0",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "opencv-python>=4.13.0.92",
]

# END - project setting

# START - linting tool setting
[tool.ruff.lint]
select = ["E", "F", "I", "TC004"]
ignore = ["F401"]

[tool.ruff.format]
docstring-code-format = true
exclude = ["trash"]

[tool.pyright]
stubPath = ".typing"
typeCheckingMode = "strict"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

# END - linting tool setting

# START - build tool

[tool.uv.build-backend]
module-name = "simulac"
module-root = ""
source-include = ["simulac/**"]

# END - build tool

# START - testing tool
[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external web service",
]
pythonpath = ["."]
# END - testing tool
